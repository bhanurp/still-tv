name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare verified local toolchain
        run: python3 tools/bootstrap.py
      - name: Test and build
        run: |
          sh test.sh
          sh build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: still-tv-development-apk
          path: build/still-tv.apk
          if-no-files-found: error
          retention-days: 7
